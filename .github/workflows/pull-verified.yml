name: Pull verified files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev openssh-client
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EMBERWAKE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan emberwake.moon-dragon.us >> ~/.ssh/known_hosts
      - name: Pull verified files
        run: |
          for f in crates/app/src/server/content_queries.rs crates/app/src/server/content_write.rs crates/app/src/server/content_write_queries.rs crates/app/src/server/extended_auth.rs crates/app/src/server/auth_queries.rs crates/app/src/server/auth_helper.rs crates/app/src/server/import_export.rs crates/app/src/server/discovery.rs crates/app/src/server/settings.rs crates/app/src/server/settings_queries.rs crates/app/Cargo.toml crates/server/src/main.rs crates/server/src/config.rs deny.toml Cargo.lock; do
            scp emberwake.moon-dragon.us:/tmp/emberwake-build/$f $f
          done
      - name: Run cargo fmt
        run: cargo fmt --all
      - name: Verify fmt
        run: cargo fmt --all --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "fix: pull verified files from emberwake.moon-dragon.us + cargo fmt"
          git push