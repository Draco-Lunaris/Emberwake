name: Apply all fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Run cargo fmt
        run: cargo fmt --all
      - name: Run cargo clippy --fix
        run: cargo clippy --all-targets --all-features --fix --allow-dirty --allow-staged
      - name: Run cargo fmt again
        run: cargo fmt --all
      - name: Verify fmt
        run: cargo fmt --all --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "fix: cargo fmt + cargo clippy --fix"
          git push