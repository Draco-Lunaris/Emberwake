# Release — builds the image, pushes to GHCR, signs with cosign, generates SBOM.
# ARM64 temporarily disabled (QEMU too slow on GitHub runners).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/emberwake

jobs:
  build-sign-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Supply-chain gate (cargo-deny)
        uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push (amd64 only)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the image (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE_LOWER=$(echo "${REGISTRY}/${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${IMAGE_LOWER}@${DIGEST}"
      - name: Generate CycloneDX SBOM
        uses: dtolnay/rust-toolchain@stable
      - run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json --override-filename emberwake.cdx
      - name: Attach SBOM to the GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            emberwake.cdx.json
          generate_release_notes: true
