name: Fix tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Fix FromStr import
        run: sed -i 's/^use std::str::FromStr;$/#[cfg(feature = "ssr")]\nuse std::str::FromStr;/' crates/app/src/server/extended_auth.rs
      - name: Fix tracing in discovery.rs
        run: |
          sed -i 's/tracing::warn!("discovery docker lock poisoned — returning empty");/warn_log("discovery docker lock poisoned — returning empty");/' crates/app/src/server/discovery.rs
          sed -i 's/tracing::warn!("discovery k8s lock poisoned — returning empty");/warn_log("discovery k8s lock poisoned — returning empty");/' crates/app/src/server/discovery.rs
          sed -i 's/Err(e) => tracing::warn!("discovery docker lock poisoned — set skipped: {e}"),/Err(e) => warn_log(\&format!("discovery docker lock poisoned — set skipped: {e}")),/' crates/app/src/server/discovery.rs
          sed -i 's/Err(e) => tracing::warn!("discovery k8s lock poisoned — set skipped: {e}"),/Err(e) => warn_log(\&format!("discovery k8s lock poisoned — set skipped: {e}")),/' crates/app/src/server/discovery.rs
          sed -i 's/Err(e) => tracing::warn!("discovery docker lock poisoned — add skipped: {e}"),/Err(e) => warn_log(\&format!("discovery docker lock poisoned — add skipped: {e}")),/' crates/app/src/server/discovery.rs
          sed -i 's/Err(e) => tracing::warn!("discovery k8s lock poisoned — add skipped: {e}"),/Err(e) => warn_log(\&format!("discovery k8s lock poisoned — add skipped: {e}")),/' crates/app/src/server/discovery.rs
          sed -i 's/Err(e) => tracing::warn!("discovery docker lock poisoned — remove skipped: {e}"),/Err(e) => warn_log(\&format!("discovery docker lock poisoned — remove skipped: {e}")),/' crates/app/src/server/discovery.rs
          sed -i 's/Err(e) => tracing::warn!("discovery k8s lock poisoned — remove skipped: {e}"),/Err(e) => warn_log(\&format!("discovery k8s lock poisoned — remove skipped: {e}")),/' crates/app/src/server/discovery.rs
          sed -i '/^use crate::domain::DiscoveredService;$/a\
\
#[cfg(feature = "ssr")]\
fn warn_log(msg: \&str) {\
    tracing::warn!("{msg}");\
}\
\
#[cfg(not(feature = "ssr"))]\
fn warn_log(_msg: \&str) {}' crates/app/src/server/discovery.rs
      - name: Run cargo fmt
        run: cargo fmt --all
      - name: Verify fmt
        run: cargo fmt --all --check
      - name: Run cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run cargo test
        run: cargo test
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "fix: gate tracing behind ssr in discovery.rs + gate FromStr in extended_auth.rs"
          git push