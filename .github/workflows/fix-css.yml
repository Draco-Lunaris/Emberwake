name: Fix CSS + push

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Fix CSS — bookmark layout
        run: |
          python3 << 'PYEOF'
          with open('style/main.css') as f:
              content = f.read()
          old = '''.pinned-categories .category {
    column-count: var(--section-columns, 3);
    column-gap: calc(var(--spacing) * 1.5);
}
.pinned-categories .bookmarks {
    break-inside: avoid-column;
}'''
          new = '''.pinned-categories .category {
    display: flex;
    flex-direction: column;
    gap: calc(var(--spacing) * 0.5);
}
.pinned-categories .category h3 {
    margin: 0;
}
.pinned-categories .bookmarks {
    column-count: var(--section-columns, 3);
    column-gap: calc(var(--spacing) * 1.5);
    list-style: none;
    padding: 0;
    margin: 0;
}
.pinned-categories .bookmarks li {
    break-inside: avoid-column;
}'''
          content = content.replace(old, new)
          with open('style/main.css', 'w') as f:
              f.write(content)
          print('Fixed CSS')
          PYEOF
      - name: Run cargo fmt
        run: cargo fmt --all
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "fix: bookmark layout — column-count on .bookmarks not .category (title was flowing into columns)"
          git push
