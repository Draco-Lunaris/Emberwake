name: Fix FromStr

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix FromStr import
        run: sed -i 's/^use std::str::FromStr;$/#[cfg(feature = "ssr")]\nuse std::str::FromStr;/' crates/app/src/server/extended_auth.rs
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "fix: gate FromStr import behind ssr feature in extended_auth.rs"
          git push
