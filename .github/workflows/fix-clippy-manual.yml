name: Fix clippy manual

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Fix IconsDir unwrap
        run: sed -i 's/\.map(|d| d\.0)/\.map(|d| d.0.0)/g' crates/app/src/server/content_write.rs
      - name: Fix map_or to is_none_or
        run: sed -i 's/\.map_or(true, |v| v == "true" || v == "1")/.is_none_or(|v| v == "true" || v == "1")/g' crates/app/src/server/content_queries.rs
      - name: Fix collapsible_if
        run: |
          python3 -c "
          with open('crates/app/src/server/content_write.rs') as f:
              c = f.read()
          old = '''        if let Some(cat) = patch.category_id {
            if cat == Uuid::nil() {
                return Err(ServerFnError::from(AppError::Validation(
                    \"category_id is required\".into(),
                )));
            }
        }'''
          new = '''        if let Some(cat) = patch.category_id
            && cat == Uuid::nil()
        {
            return Err(ServerFnError::from(AppError::Validation(
                \"category_id is required\".into(),
            )));
        }'''
          c = c.replace(old, new)
          with open('crates/app/src/server/content_write.rs', 'w') as f:
              f.write(c)
          "
      - name: Run cargo fmt
        run: cargo fmt --all
      - name: Run cargo clippy --fix
        run: cargo clippy --all-targets --all-features --fix --allow-dirty --allow-staged
      - name: Run cargo fmt again
        run: cargo fmt --all
      - name: Verify fmt
        run: cargo fmt --all --check
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes needed" && exit 0
          git commit -m "fix: manual clippy fixes (IconsDir.0.0, is_none_or, collapsible_if) + cargo fmt"
          git push